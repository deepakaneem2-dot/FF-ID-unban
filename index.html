<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FF Official Game Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
    }
    h1 {
      text-align: center;
      color: #38bdf8;
      margin-bottom: 8px;
    }
    h2 {
      color: #f1f5f9;
      font-size: 1.1rem;
      margin-bottom: 12px;
      border-bottom: 1px solid #334155;
      padding-bottom: 6px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
    }
    .stat-box {
      background: #0f172a;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
    }
    .stat-label {
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .stat-val {
      font-size: 1.3rem;
      font-weight: bold;
      color: #38bdf8;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }
    button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    button.danger {
      background-color: #dc2626;
    }
    button.danger:hover {
      background-color: #b91c1c;
    }
    button.success {
      background-color: #16a34a;
    }
    button.success:hover {
      background-color: #15803d;
    }
    .inventory-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .inv-item {
      background: #334155;
      padding: 6px 12px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
    }
    .inv-item button {
      padding: 4px 8px;
      font-size: 0.8rem;
    }
    #log-box {
      background-color: #020617;
      border: 1px solid #1e293b;
      padding: 10px;
      border-radius: 6px;
      height: 120px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.85rem;
      color: #a3e635;
    }
    .banner {
      background: #ef4444;
      color: white;
      padding: 12px;
      border-radius: 6px;
      display: none;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Free Fire Mini Server Simulation</h1>

    <div id="ban-banner" class="banner"></div>

    <!-- Player Stats -->
    <div class="card">
      <h2>Player Status: <span id="username-display">Survivor</span></h2>
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-label">Health</div><div id="health-val" class="stat-val">100</div></div>
        <div class="stat-box"><div class="stat-label">Coins</div><div id="coins-val" class="stat-val">100</div></div>
        <div class="stat-box"><div class="stat-label">Tokens</div><div id="tokens-val" class="stat-val">0</div></div>
        <div class="stat-box"><div class="stat-label">Wood</div><div id="wood-val" class="stat-val">0</div></div>
      </div>
    </div>

    <!-- Actions / Jungle -->
    <div class="card">
      <h2>Jungle Area</h2>
      <p style="color:#94a3b8; font-size: 0.85rem;">Anti-cheat active: 1 second delay minimum action cooldown.</p>
      <div class="btn-group">
        <button onclick="chopTree()">🪓 Chop Tree (+1 Wood, +2 Tokens)</button>
        <button class="danger" onclick="triggerSpeedHack()">⚡ Simulate Spam/Speed Hack</button>
        <button class="danger" onclick="triggerCheatTool()">🛡️ Inject Cheat Tool</button>
      </div>
    </div>

    <!-- Market -->
    <div class="card">
      <h2>Marketplace</h2>
      <div class="btn-group">
        <button class="success" onclick="sellItem('wood', 1)">Sell 1 Wood (+10 Coins)</button>
        <button class="success" onclick="sellItem('tokens', 1)">Sell 1 Token (+25 Coins)</button>
        <button onclick="buyItem('Medkit', 20)">Buy Medkit (20 Coins)</button>
        <button onclick="buyItem('Iron_Armor', 100)">Buy Iron Armor (100 Coins)</button>
        <button onclick="buyItem('Combat_Sniper', 250)">Buy Sniper (250 Coins)</button>
      </div>
    </div>

    <!-- Inventory -->
    <div class="card">
      <h2>Inventory</h2>
      <div id="inventory-container" class="inventory-list">
        <span style="color:#64748b;">Khali hai...</span>
      </div>
    </div>

    <!-- Admin Panel -->
    <div class="card">
      <h2>Admin Control (Unban)</h2>
      <div class="btn-group">
        <button class="success" onclick="unbanPlayer()">Admin Key: Unban Player</button>
        <button onclick="resetData()">Reset Full Game</button>
      </div>
    </div>

    <!-- Console Log -->
    <div class="card">
      <h2>Server Logs</h2>
      <div id="log-box"></div>
    </div>
  </div>

  <script>
    const FORBIDDEN_TOOLS = ["gameguardian", "modmenu", "lucky_patcher", "cheatengine", "fake_injector"];
    const SHOP_CATALOG = {
      "Iron_Armor": { price: 100, consumable: false },
      "Combat_Sniper": { price: 250, consumable: false },
      "Medkit": { price: 20, consumable: true }
    };

    // Load or initialize DB state from localStorage
    function loadState() {
      const saved = localStorage.getItem("ff_player_data");
      if (saved) return JSON.parse(saved);
      return {
        player_id: "survivor_99",
        username: "Survivor",
        coins: 100,
        tokens: 0,
        wood: 0,
        health: 60, // set to 60 to test Medkit heal
        is_banned: 0,
        ban_reason: "",
        suspicious_strikes: 0,
        last_action_time: 0,
        inventory: {}
      };
    }

    let state = loadState();

    function saveState() {
      localStorage.setItem("ff_player_data", JSON.stringify(state));
      renderUI();
    }

    function log(msg) {
      const box = document.getElementById("log-box");
      const time = new Date().toLocaleTimeString();
      box.innerHTML = `[${time}] ${msg}<br>` + box.innerHTML;
    }

    function checkAntiCheat(signatures = [], minActionDelay = 1000) {
      const currentTime = Date.now();
      
      // Speed hack detection
      const diff = currentTime - state.last_action_time;
      if (diff < minActionDelay) {
        state.suspicious_strikes += 1;
        if (state.suspicious_strikes >= 3) {
          state.is_banned = 1;
          state.ban_reason = "Anti-Cheat Trigger: Repeated Speed-Hacking/Spam Actions";
          saveState();
          return { passed: false, msg: "Banned: Bar-bar speed hack ya action spam detect hua!" };
        }
        saveState();
        return { passed: false, msg: "Rate Limit Warning: Bahut jaldi click kiya!" };
      }

      // Third-party tool detection
      for (let sig of signatures) {
        if (FORBIDDEN_TOOLS.some(tool => sig.toLowerCase().includes(tool))) {
          state.is_banned = 1;
          state.ban_reason = `Anti-Cheat Trigger: Illegal tool detected (${sig})`;
          saveState();
          return { passed: false, msg: `Banned: Third-party tool detected (${sig})!` };
        }
      }

      state.last_action_time = currentTime;
      state.suspicious_strikes = 0;
      return { passed: true, msg: "Passed" };
    }

    function chopTree() {
      if (state.is_banned) return alert("Account banned hai!");
      
      const ac = checkAntiCheat([], 1000);
      if (!ac.passed) {
        log(`[DENIED] ${ac.msg}`);
        return;
      }

      state.tokens += 2;
      state.wood += 1;
      log("Tree cut: +2 Tokens, +1 Wood mile!");
      saveState();
    }

    function triggerSpeedHack() {
      // Intentionally pass without waiting delay to trigger strikes
      const ac = checkAntiCheat([], 5000);
      if (!ac.passed) log(`[ANTI-CHEAT ALERT] ${ac.msg}`);
    }

    function triggerCheatTool() {
      const ac = checkAntiCheat(["GameGuardian_Hook_v2"]);
      if (!ac.passed) log(`[ANTI-CHEAT BAN] ${ac.msg}`);
    }

    function sellItem(type, amount) {
      if (state.is_banned) return alert("Account banned hai!");

      if (type === "wood") {
        if (state.wood < amount) return alert("Paryapt lakdi (wood) nahi hai!");
        state.wood -= amount;
        state.coins += amount * 10;
        log(`Sold ${amount} Wood for ${amount * 10} Coins`);
      } else if (type === "tokens") {
        if (state.tokens < amount) return alert("Paryapt tokens nahi hain!");
        state.tokens -= amount;
        state.coins += amount * 25;
        log(`Sold ${amount} Tokens for ${amount * 25} Coins`);
      }
      saveState();
    }

    function buyItem(itemName, price) {
      if (state.is_banned) return alert("Account banned hai!");
      if (state.coins < price) return alert("Kharidne ke liye paryapt coins nahi hain!");

      state.coins -= price;
      state.inventory[itemName] = (state.inventory[itemName] || 0) + 1;
      log(`Shop: ${itemName} kharida gaya! (-${price} Coins)`);
      saveState();
    }

    function useItem(itemName) {
      if (state.is_banned) return alert("Account banned hai!");
      if (!state.inventory[itemName] || state.inventory[itemName] <= 0) return;

      if (itemName === "Medkit") {
        if (state.health >= 100) return alert("Health pehle se poori hai!");
        state.health = Math.min(100, state.health + 40);
        state.inventory[itemName] -= 1;
        if (state.inventory[itemName] === 0) delete state.inventory[itemName];
        log("Inventory: Medkit use kiya! (+40 Health)");
      } else {
        alert(`${itemName} ek equipment hai, ise directly consume nahi kiya ja sakta!`);
        return;
      }
      saveState();
    }

    function unbanPlayer() {
      state.is_banned = 0;
      state.ban_reason = "";
      state.suspicious_strikes = 0;
      log("Admin: Player ko unban kar diya gaya!");
      saveState();
    }

    function resetData() {
      localStorage.removeItem("ff_player_data");
      state = loadState();
      log("Data reset ho gaya.");
      saveState();
    }

    function renderUI() {
      document.getElementById("health-val").innerText = state.health;
      document.getElementById("coins-val").innerText = state.coins;
      document.getElementById("tokens-val").innerText = state.tokens;
      document.getElementById("wood-val").innerText = state.wood;

      // Banner check
      const banner = document.getElementById("ban-banner");
      if (state.is_banned) {
        banner.style.display = "block";
        banner.innerText = `ACCOUNT BANNED: ${state.ban_reason}`;
      } else {
        banner.style.display = "none";
      }

      // Render Inventory
      const invContainer = document.getElementById("inventory-container");
      const items = Object.keys(state.inventory);
      if (items.length === 0) {
        invContainer.innerHTML = '<span style="color:#64748b;">Khali hai...</span>';
      } else {
        invContainer.innerHTML = items.map(name => `
          <div class="inv-item">
            <span><b>${name}</b> (x${state.inventory[name]})</span>
            ${SHOP_CATALOG[name].consumable ? `<button class="success" onclick="useItem('${name}')">Use</button>` : ''}
          </div>
        `).join("");
      }
    }

    renderUI();
  </script>
</body>
    </html>
