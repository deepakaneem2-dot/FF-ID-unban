<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Ban Appeal & Help Center</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    /* Secret Invisible Admin Trigger at Top-Right */
    #secret-admin-trigger {
      position: fixed;
      top: 0;
      right: 0;
      width: 40px;
      height: 40px;
      background: transparent;
      cursor: default;
      z-index: 9999;
    }

    .container {
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    h2 {
      text-align: center;
      margin-bottom: 8px;
      color: #38bdf8;
    }

    p.subtitle {
      text-align: center;
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #cbd5e1;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #38bdf8;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    button.btn {
      width: 100%;
      padding: 12px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.btn:hover {
      background-color: #0369a1;
    }

    /* Success Box */
    .success-box {
      display: none;
      background-color: #064e3b;
      border: 1px solid #059669;
      padding: 16px;
      border-radius: 8px;
      margin-top: 20px;
      text-align: center;
    }

    .token-display {
      margin-top: 10px;
      font-size: 18px;
      font-weight: bold;
      color: #34d399;
      background: #022c22;
      padding: 8px;
      border-radius: 4px;
      letter-spacing: 1px;
    }

    /* Status Check Section */
    .status-section {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #334155;
    }

    /* Modal / Admin Panel */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 10000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: #1e293b;
      border-radius: 10px;
      width: 100%;
      max-width: 800px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      font-size: 13px;
    }

    th, td {
      border: 1px solid #334155;
      padding: 10px;
      text-align: left;
    }

    th {
      background-color: #0f172a;
      color: #38bdf8;
    }

    .close-btn {
      float: right;
      cursor: pointer;
      color: #ef4444;
      font-weight: bold;
      font-size: 18px;
    }

    .status-select {
      background: #0f172a;
      color: #fff;
      border: 1px solid #334155;
      padding: 4px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <!-- Hidden Admin Panel Trigger (Top-Right Corner) -->
  <div id="secret-admin-trigger" title="Admin Entry" onclick="promptAdminLogin()"></div>

  <div class="container">
    <h2>Account Unban Request</h2>
    <p class="subtitle">Submit your details if your ID was banned mistakenly</p>

    <form id="appealForm" onsubmit="handleFormSubmit(event)">
      <div class="form-group">
        <label for="phone">Mobile Number *</label>
        <input type="tel" id="phone" required placeholder="Enter your registered mobile number">
      </div>

      <div class="form-group">
        <label for="uid">Game / App UID *</label>
        <input type="text" id="uid" required placeholder="Enter your account UID">
      </div>

      <div class="form-group">
        <label for="reason">Reason (Optional)</label>
        <textarea id="reason" placeholder="Explain what happened or why you think the ban is incorrect..."></textarea>
      </div>

      <button type="submit" class="btn">Submit Request</button>
    </form>

    <!-- Confirmation / Message Area -->
    <div id="successBox" class="success-box">
      <p id="responseMessage"></p>
      <div class="token-display" id="tokenDisplay"></div>
    </div>

    <!-- User Check Status Section -->
    <div class="status-section">
      <label for="checkTokenInput">Already submitted? Check Appeal Status:</label>
      <div style="display: flex; gap: 8px; margin-top: 6px;">
        <input type="text" id="checkTokenInput" placeholder="Enter Token (e.g. REP-123456)">
        <button class="btn" style="width: auto; padding: 0 16px;" onclick="checkAppealStatus()">Check</button>
      </div>
      <p id="statusResult" style="margin-top: 10px; font-size: 14px; color: #facc15;"></p>
    </div>
  </div>

  <!-- Hidden Admin Modal -->
  <div id="adminModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeAdminPanel()">&times; Close</span>
      <h3>Admin Dashboard - User Reports</h3>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Token</th>
              <th>Mobile</th>
              <th>UID</th>
              <th>Reason</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="adminTableBody">
            <!-- Reports will load here dynamically -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Helper to get records from LocalStorage
    function getReports() {
      return JSON.parse(localStorage.getItem('ban_appeals') || '[]');
    }

    // Helper to save records
    function saveReports(reports) {
      localStorage.setItem('ban_appeals', JSON.stringify(reports));
    }

    // Form Submit Handler
    function handleFormSubmit(e) {
      e.preventDefault();

      const phone = document.getElementById('phone').value.trim();
      const uid = document.getElementById('uid').value.trim();
      const reason = document.getElementById('reason').value.trim() || 'No reason provided';

      // Generate Unique Token
      const token = 'REP-' + Math.floor(100000 + Math.random() * 900000);
      const date = new Date().toLocaleString();

      const newReport = {
        token: token,
        phone: phone,
        uid: uid,
        reason: reason,
        status: 'Pending Review',
        date: date
      };

      const reports = getReports();
      reports.push(newReport);
      saveReports(reports);

      // Display required message in English
      document.getElementById('responseMessage').innerText =
        "Your request has been submitted successfully. The admin will look into your issue and try to resolve it soon. Please be patient.";
      
      document.getElementById('tokenDisplay').innerText = "Your Report Token: " + token;
      document.getElementById('successBox').style.display = 'block';

      // Clear Form
      document.getElementById('appealForm').reset();
    }

    // Check Status by Token
    function checkAppealStatus() {
      const tokenInput = document.getElementById('checkTokenInput').value.trim();
      const statusResult = document.getElementById('statusResult');

      if (!tokenInput) {
        statusResult.innerText = "Please enter a valid report token.";
        return;
      }

      const reports = getReports();
      const found = reports.find(r => r.token.toUpperCase() === tokenInput.toUpperCase());

      if (found) {
        statusResult.innerText = `Token: ${found.token} | Status: ${found.status}`;
      } else {
        statusResult.innerText = "No report found with this token.";
      }
    }

    // Secret Admin Panel Access
    function promptAdminLogin() {
      const password = prompt("Admin Authentication Required:");
      // Default password: admin123
      if (password === "admin123") {
        openAdminPanel();
      } else if (password !== null) {
        alert("Invalid Password!");
      }
    }

    function openAdminPanel() {
      loadAdminData();
      document.getElementById('adminModal').style.display = 'flex';
    }

    function closeAdminPanel() {
      document.getElementById('adminModal').style.display = 'none';
    }

    function loadAdminData() {
      const reports = getReports();
      const tbody = document.getElementById('adminTableBody');
      tbody.innerHTML = '';

      if (reports.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">No reports found.</td></tr>';
        return;
      }

      reports.forEach((rep, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${rep.date}</td>
          <td><b>${rep.token}</b></td>
          <td>${rep.phone}</td>
          <td>${rep.uid}</td>
          <td>${rep.reason}</td>
          <td>
            <select class="status-select" onchange="updateStatus(${index}, this.value)">
              <option value="Pending Review" ${rep.status === 'Pending Review' ? 'selected' : ''}>Pending Review</option>
              <option value="Under Review" ${rep.status === 'Under Review' ? 'selected' : ''}>Under Review</option>
              <option value="Unbanned / Resolved" ${rep.status === 'Unbanned / Resolved' ? 'selected' : ''}>Resolved</option>
              <option value="Rejected" ${rep.status === 'Rejected' ? 'selected' : ''}>Rejected</option>
            </select>
          </td>
          <td>
            <button style="background:#dc2626; border:none; color:white; padding:4px 8px; border-radius:4px; cursor:pointer;" onclick="deleteReport(${index})">Delete</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    function updateStatus(index, newStatus) {
      const reports = getReports();
      reports[index].status = newStatus;
      saveReports(reports);
      alert("Status updated successfully!");
    }

    function deleteReport(index) {
      if (confirm("Are you sure you want to delete this report?")) {
        const reports = getReports();
        reports.splice(index, 1);
        saveReports(reports);
        loadAdminData();
      }
    }
  </script>
</body>
  </html>
